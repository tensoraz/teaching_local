<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teacher Login</title>
<link rel="stylesheet" href="/courses/shared/theme.css">
<script src="/courses/shared/site.js"></script>
<style>
  body { min-height: 100vh; display: grid; place-items: center; padding: 16px; }
  .card { max-width: 400px; width: 100%; }
  #pin { font-size: 28px; letter-spacing: .3em; text-align: center; width: 100%; }
  #err { color: var(--bad); min-height: 1.4em; margin: 8px 0; }
</style>
</head>
<body>
<form class="card" onsubmit="login(event)">
  <span class="eyebrow">Teacher only</span>
  <h2 style="margin-top:6px">Enter the teacher PIN</h2>
  <p class="muted" style="font-size:15px" id="which">This page is for the teacher. Enter the master PIN shown in the terminal where <code>server.py</code> is running. On the teacher’s own laptop no PIN is needed.</p>
  <input type="password" id="pin" inputmode="numeric" autocomplete="off" autofocus required>
  <p id="err"></p>
  <button class="btn" style="width:100%;justify-content:center">Continue</button>
  <p style="text-align:center;margin:14px 0 0;font-size:14px"><a href="/courses/">Student? Go to the course library</a></p>
</form>
<script>
var course = ((new URLSearchParams(location.search).get('next') || '').match(/^\/courses\/([a-z0-9-]+)\//) || [])[1];
if (course) document.getElementById('which').innerHTML = 'This page is for the teacher of <b>' + course + '</b>. Enter that course’s PIN (or the master PIN). Both are shown in the terminal where <code>server.py</code> is running.';
function login(e) {
  e.preventDefault();
  var next = new URLSearchParams(location.search).get('next') || '/teacher';
  fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ pin: document.getElementById('pin').value, next: next }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (d.ok) location.replace(d.next);
      else { document.getElementById('err').textContent = d.error; document.getElementById('pin').select(); }
    })
    .catch(function () { document.getElementById('err').textContent = 'Could not reach the classroom server.'; });
}
</script>
</body>
</html>
